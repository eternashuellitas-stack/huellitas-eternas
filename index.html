<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2bfd8" />
    <meta name="description"
        content="Huellitas Eternas: una experiencia para conservar historias y momentos especiales." />
    <title>Huellitas Eternas | Preparando...</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png" />
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <main class="loader-wrap" aria-live="polite">
        <section class="loader-card">
            <div class="orbit" aria-hidden="true"><i></i></div>
            <img class="logo" src="assets/images/icon.png" alt="Huellitas Eternas" />
            <h1>Huellitas Eternas</h1>
            <p id="loadStatus" class="status">Preparando tu experiencia…</p>
            <div class="bar" role="progressbar" aria-label="Cargando" aria-valuemin="0" aria-valuemax="100"
                aria-valuenow="0">
                <span id="loadBar"></span>
            </div>
            <div class="loader-meta">
                <span>Personalización</span><span>Espacio digital</span><span>Recuerdos</span>
            </div>
            <button id="skipLoad" class="skip-load" type="button">
                Continuar ahora
            </button>
        </section>
    </main>
    <script src="assets/js/script.js"></script>
</body>

</html>
